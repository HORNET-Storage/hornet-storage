    tiers:
        - monthly_limit_bytes: 104857600
          name: Basic
          price_sats: 0
          unlimited: false
    write: allowed_users
content_filtering:
    image_moderation:
        check_interval_seconds: 30
        concurrency: 5
        enabled: true
        mode: full
        threshold: 0.4
        timeout_seconds: 600
    text_filter:
        cache_size: 10000
        cache_ttl_seconds: 60
        enabled: true
        # Kinds whose content is indexed by the embedded NIP-50 Bleve index.
        full_text_search_kinds:
            - 1
            - 31415
            - 39504
        # Candidate paging keeps ACL/moderation filtering outside the index trustworthy.
        search_page_size: 128
        max_search_candidates: 5000
event_filtering:
    allow_unregistered_kinds: false
    dynamic_kinds:
        allowed_kinds: []
        enabled: false
    kind_whitelist:
        - kind0
